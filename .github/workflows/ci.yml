name: Mobile CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1
      - run: npm run validate
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: bash -n spike/android-node-runtime/build-apk.sh
      - run: python3 -m py_compile deploy/publish-mobile-r2.py
      - run: python3 -m json.tool runtime.lock.json >/dev/null
      - run: python3 -m json.tool mobile-version.json >/dev/null

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare Android SDK
        shell: bash
        run: |
          sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          test -n "$sdkmanager"
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1"
          dirname "$sdkmanager" >> "$GITHUB_PATH"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
      - run: node scripts/fetch-node-mobile.mjs android
      - run: node scripts/prepare-sillytavern.mjs android
      - run: chmod +x spike/android-node-runtime/gradlew spike/android-node-runtime/build-apk.sh
      - name: Build debug APK
        env:
          ST_SOURCE: ${{ github.workspace }}/.build/sillytavern-android
        run: spike/android-node-runtime/build-apk.sh debug
      - name: Verify APK and native page alignment
        shell: bash
        run: |
          set -euo pipefail
          apk=spike/android-node-runtime/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 "$apk"
          mkdir -p artifacts/android-debug
          cp "$apk" artifacts/android-debug/
          sha256sum "$apk" | awk '{print $1}' > artifacts/android-debug/SHA256
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: android-debug
          path: artifacts/android-debug/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1
      - run: node scripts/fetch-node-mobile.mjs ios
      - run: node scripts/prepare-sillytavern.mjs ios
      - run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Generate Xcode project
        working-directory: spike/ios-node-runtime
        run: xcodegen generate
      - name: Compile simulator app
        working-directory: spike/ios-node-runtime
        run: |
          xcodebuild \
            -project Chef25Mobile.xcodeproj \
            -scheme Chef25 \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            build
