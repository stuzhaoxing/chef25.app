name: Build and publish mobile preview

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Upload to TestFlight/R2 and create a GitHub pre-release
        type: boolean
        default: false
      testflight_only:
        description: Upload iPhone build to TestFlight without publishing APK or manifests
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mobile-release
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: mobile-release
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1
      - run: npm run validate
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: bash -n spike/android-node-runtime/build-apk.sh
      - run: python3 -m py_compile deploy/publish-mobile-r2.py
      - id: version
        run: |
          version=$(node -p "require('./mobile-version.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_number=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
      - name: Check publication configuration
        if: inputs.publish || inputs.testflight_only
        shell: bash
        env:
          PUBLISH: ${{ inputs.publish }}
          TESTFLIGHT_ONLY: ${{ inputs.testflight_only }}
          APPLE_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TESTFLIGHT_PUBLIC_URL: ${{ vars.TESTFLIGHT_PUBLIC_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CHEF25_R2_BUCKET: ${{ vars.CHEF25_R2_BUCKET }}
          CHEF25_DOWNLOAD_ORIGIN: ${{ vars.CHEF25_DOWNLOAD_ORIGIN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          if [[ "$PUBLISH" == "$TESTFLIGHT_ONLY" ]]; then
            printf 'Choose either publish or testflight_only.\n' >&2
            exit 1
          fi
          missing=()
          for name in \
            APPLE_DISTRIBUTION_CERTIFICATE_BASE64 \
            APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD \
            APP_STORE_CONNECT_KEY_ID \
            APP_STORE_CONNECT_ISSUER_ID \
            APP_STORE_CONNECT_PRIVATE_KEY_BASE64 \
            APPLE_TEAM_ID; do
            if [[ -z "${!name:-}" ]]; then missing+=("$name"); fi
          done
          if [[ "$PUBLISH" == "true" ]]; then
            for name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD \
            TESTFLIGHT_PUBLIC_URL \
            CLOUDFLARE_ACCOUNT_ID \
            CHEF25_R2_BUCKET \
            CHEF25_DOWNLOAD_ORIGIN \
            R2_ACCESS_KEY_ID \
            R2_SECRET_ACCESS_KEY; do
              if [[ -z "${!name:-}" ]]; then missing+=("$name"); fi
            done
          fi
          if (( ${#missing[@]} )); then
            printf 'Missing publication configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          if [[ "$PUBLISH" == "true" ]]; then
            [[ "$TESTFLIGHT_PUBLIC_URL" =~ ^https://testflight\.apple\.com/join/[A-Za-z0-9]+$ ]]
            [[ "$CHEF25_DOWNLOAD_ORIGIN" == "https://download.chef25.com" ]]
          fi

  android:
    needs: validate
    if: inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    environment: mobile-release
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare Android SDK
        shell: bash
        run: |
          sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          test -n "$sdkmanager"
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1"
          dirname "$sdkmanager" >> "$GITHUB_PATH"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
      - run: node scripts/fetch-node-mobile.mjs android
      - run: node scripts/prepare-sillytavern.mjs android
      - name: Prepare release signing
        if: inputs.publish
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/chef25-release.jks"
          test -s "$RUNNER_TEMP/chef25-release.jks"
      - name: Build Android app
        shell: bash
        env:
          ST_SOURCE: ${{ github.workspace }}/.build/sillytavern-android
          ANDROID_KEYSTORE_PATH: ${{ inputs.publish && format('{0}/chef25-release.jks', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          CHEF25_VERSION_NAME: ${{ needs.validate.outputs.version }}
          CHEF25_VERSION_CODE: ${{ needs.validate.outputs.build_number }}
        run: |
          chmod +x spike/android-node-runtime/gradlew spike/android-node-runtime/build-apk.sh
          if [[ "${{ inputs.publish }}" == "true" ]]; then
            mode=release
          else
            mode=debug
          fi
          spike/android-node-runtime/build-apk.sh "$mode"
      - name: Verify Android package
        shell: bash
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          if [[ "$PUBLISH" == "true" ]]; then
            source=spike/android-node-runtime/app/build/outputs/apk/release/app-release.apk
          else
            source=spike/android-node-runtime/app/build/outputs/apk/debug/app-debug.apk
          fi
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$source"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 "$source"
          mkdir -p artifacts/android
          target="artifacts/android/Chef25_${{ needs.validate.outputs.version }}_android-arm64.apk"
          cp "$source" "$target"
          sha256sum "$target" | awk '{print $1}' > "$target.sha256"
          test "$(stat -c %s "$target")" -gt 100000000
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ inputs.publish && 'android-release' || 'android-debug' }}
          path: artifacts/android/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  ios:
    needs: validate
    runs-on: macos-15
    timeout-minutes: 75
    environment: mobile-release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1
      - run: node scripts/fetch-node-mobile.mjs ios
      - run: node scripts/prepare-sillytavern.mjs ios
      - run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Generate Xcode project
        working-directory: spike/ios-node-runtime
        run: xcodegen generate
      - name: Import Apple distribution certificate
        if: inputs.publish || inputs.testflight_only
        shell: bash
        env:
          APPLE_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          certificate="$RUNNER_TEMP/chef25-distribution.p12"
          keychain="$RUNNER_TEMP/chef25-release.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          printf '%s' "$APPLE_DISTRIBUTION_CERTIFICATE_BASE64" | openssl base64 -d -A > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" \
            -P "$APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list \
            -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
      - name: Prepare App Store Connect API key
        if: inputs.publish || inputs.testflight_only
        shell: bash
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY_BASE64" | openssl base64 -d -A > "$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp "$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8" \
            "$HOME/.appstoreconnect/private_keys/"
      - name: Archive iOS app
        shell: bash
        env:
          PUBLISH: ${{ inputs.publish || inputs.testflight_only }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          args=(
            -project Chef25Mobile.xcodeproj
            -scheme Chef25
            -configuration Release
            -destination "generic/platform=iOS"
            -archivePath "$RUNNER_TEMP/Chef25.xcarchive"
            MARKETING_VERSION="${{ needs.validate.outputs.version }}"
            CURRENT_PROJECT_VERSION="${{ needs.validate.outputs.build_number }}"
          )
          if [[ "$PUBLISH" == "true" ]]; then
            args+=(
              DEVELOPMENT_TEAM="$APPLE_TEAM_ID"
              -allowProvisioningUpdates
              -authenticationKeyPath "$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
              -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID"
              -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
            )
          else
            args+=(CODE_SIGNING_ALLOWED=NO)
          fi
          cd spike/ios-node-runtime
          xcodebuild archive "${args[@]}"
      - name: Export App Store IPA
        if: inputs.publish || inputs.testflight_only
        shell: bash
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>destination</key><string>export</string>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          mkdir -p "$RUNNER_TEMP/export"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Chef25.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
          ipa=$(find "$RUNNER_TEMP/export" -name '*.ipa' -type f | head -1)
          test -n "$ipa"
          cp "$ipa" "$RUNNER_TEMP/Chef25.ipa"
      - name: Upload build to TestFlight
        if: inputs.publish || inputs.testflight_only
        shell: bash
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcrun altool \
            --upload-app \
            --type ios \
            --file "$RUNNER_TEMP/Chef25.ipa" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
      - name: Collect iOS artifact
        shell: bash
        env:
          PUBLISH: ${{ inputs.publish || inputs.testflight_only }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/ios
          if [[ "$PUBLISH" == "true" ]]; then
            cp "$RUNNER_TEMP/Chef25.ipa" "artifacts/ios/Chef25_${{ needs.validate.outputs.version }}_ios.ipa"
            shasum -a 256 artifacts/ios/*.ipa | awk '{print $1}' > artifacts/ios/Chef25_ios.sha256
          else
            ditto -c -k --sequesterRsrc --keepParent \
              "$RUNNER_TEMP/Chef25.xcarchive" \
              "artifacts/ios/Chef25_${{ needs.validate.outputs.version }}_ios_unsigned.xcarchive.zip"
          fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ (inputs.publish || inputs.testflight_only) && 'ios-release' || 'ios-unsigned' }}
          path: artifacts/ios/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    needs: [validate, android, ios]
    if: inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: mobile-release
    env:
      CHEF25_DOWNLOAD_ORIGIN: ${{ vars.CHEF25_DOWNLOAD_ORIGIN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: android-release
          path: artifacts/android
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ios-release
          path: artifacts/ios
      - name: Create mobile distribution
        shell: bash
        env:
          TESTFLIGHT_PUBLIC_URL: ${{ vars.TESTFLIGHT_PUBLIC_URL }}
          MOBILE_BUILD_NUMBER: ${{ needs.validate.outputs.build_number }}
          MOBILE_APK: ${{ github.workspace }}/artifacts/android/Chef25_${{ needs.validate.outputs.version }}_android-arm64.apk
        run: |
          MOBILE_APK_SHA256=$(cat "${MOBILE_APK}.sha256")
          export MOBILE_APK_SHA256
          node scripts/create-mobile-distribution.mjs
      - name: Validate publisher locally
        run: |
          python3 -m venv "$RUNNER_TEMP/chef25-mobile-r2"
          "$RUNNER_TEMP/chef25-mobile-r2/bin/pip" install -r deploy/requirements-r2.txt
          "$RUNNER_TEMP/chef25-mobile-r2/bin/python" deploy/publish-mobile-r2.py artifacts/mobile-distribution --dry-run
      - name: Publish immutable R2 objects and activate manifest
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CHEF25_R2_BUCKET: ${{ vars.CHEF25_R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          "$RUNNER_TEMP/chef25-mobile-r2/bin/python" deploy/publish-mobile-r2.py artifacts/mobile-distribution --activate
      - name: Verify public download and website manifest
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --retry 3 --silent --show-error \
            https://download.chef25.com/downloads/mobile/latest.json \
            -o "$RUNNER_TEMP/mobile-latest.json"
          node --input-type=module -e '
            import fs from "node:fs";
            const actual = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/mobile-latest.json"));
            const expected = JSON.parse(fs.readFileSync("artifacts/mobile-distribution/distribution.json"));
            if (JSON.stringify(actual) !== JSON.stringify(expected)) throw new Error("R2 manifest mismatch");
          '
          curl --fail --retry 3 --silent --show-error \
            https://www.chef25.com/api/downloads/mobile.json \
            -o "$RUNNER_TEMP/mobile-website.json"
          node --input-type=module -e '
            import fs from "node:fs";
            const actual = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/mobile-website.json"));
            const expected = JSON.parse(fs.readFileSync("artifacts/mobile-distribution/distribution.json"));
            if (JSON.stringify(actual) !== JSON.stringify(expected)) throw new Error("Website manifest mismatch");
          '
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: mobile-distribution
          path: artifacts/mobile-distribution/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  github-release:
    needs: [validate, publish]
    if: inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: mobile-distribution
          path: artifacts/mobile-distribution
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ios-release
          path: artifacts/ios
      - name: Create GitHub pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.validate.outputs.version }}
          BUILD_NUMBER: ${{ needs.validate.outputs.build_number }}
        run: |
          set -euo pipefail
          tag="mobile-v$VERSION"
          if git rev-parse --verify "refs/tags/$tag^{commit}" >/dev/null 2>&1; then
            test "$(git rev-parse "refs/tags/$tag^{commit}")" = "$GITHUB_SHA" || {
              printf 'Tag %s points to another commit.\n' "$tag" >&2
              exit 1
            }
          fi
          cat > release-notes.md <<EOF
          25小厨 Mobile 开发预览，构建号 $BUILD_NUMBER。

          Android APK 已使用发布密钥签名并通过 APK v2 校验；iPhone 构建已上传 TestFlight。官网下载信息由同一份 distribution 激活。
          EOF
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; immutable R2 publication remains authoritative."
          else
            gh release create "$tag" \
              artifacts/mobile-distribution/* \
              artifacts/ios/*.ipa \
              --target "$GITHUB_SHA" \
              --title "25小厨 Mobile $tag（开发预览）" \
              --notes-file release-notes.md \
              --prerelease \
              --latest=false
          fi
          gh release view "$tag" --json url --jq '.url' >> "$GITHUB_STEP_SUMMARY"
